<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle</title>

  <style>
    /* Estilos generales */
    body {
      background-color: #fdfded; 
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Tarjeta de detalle */
    .card {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 320px;
    }

    /* Título */
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      font-style: italic;
      font-family: 'Pacifico', cursive;
      color: #000000;
      margin-bottom: 8px;
    }

    /* Línea divisoria */
    .divider {
      border-top: 2px solid #e0e0e0;
      margin-bottom: 12px;
    }

    /* ID */
    .id {
      font-size: 14px;
      text-align: right;
      color: #333;
    }

    /* Texto en negrita */
    .bold {
      font-weight: bold;
    }

    /* Texto en color naranja */
    .highlight {
      color: #d6863a;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Detalle</h1>
    <div class="id">id: 1</div>
    <hr class="divider">
    <p><span class="bold">Código:</span> <span class="highlight">xxxx</span></p>
    <p><span class="bold">Porcentaje:</span> 80%</p>
    <p><span class="bold">Usuario</span></p>
    <p><span class="bold">Carga</span></p>
  </div>

</body>
</html>
