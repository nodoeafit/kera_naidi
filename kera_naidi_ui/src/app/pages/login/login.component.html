<div class="min-h-screen flex items-center justify-center bg-custom">
    <div class="bg-black bg-opacity-50 p-5 rounded-xl shadow-lg max-w-md w-full">
      <form class="space-y-6">
        <h1 class="text-3xl font-bold text-center text-white">Paramo Login</h1>
        <div class="form-control">
          <label class="label"><span class="label-text text-white">Email</span></label>
          <input type="email" placeholder="email" class="input input-bordered w-full" required />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text text-white">Password</span></label>
          <input type="password" placeholder="password" class="input input-bordered w-full" required />
          <label class="label">
            <a href="#" class="label-text-alt link link-hover text-white">Forgot password?</a>
          </label>
        </div>
        <div class="form-control mt-6">
          <button class="btn btn-primary w-full">Login</button>
        </div>
        <div class="divider text-white">OR</div>
        <div class="form-control">
          <button class="btn btn-outline flex items-center justify-center w-full" (click)="simulateGoogleLogin()">
            <img src="assets/pngegg.png" class="w-7 h-5 mr-2" alt="Google Icon" />
            Continuar con Google
          </button>
        </div>
      </form>
    </div>
  </div>
